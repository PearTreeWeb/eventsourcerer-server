api_platform:
    title: EventSourcerer API
    version: 1.0.0
    formats:
        json: [ 'application/json' ]
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    exception_to_status:
        App\Domain\Common\Exception\PropertyTypeValueIsIncompatible: 422
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true
            deduplicate_resource_short_names: true
        pagination_items_per_page: 10
